# Every push to main: checks (types, tests, client build) and, at the same time, the three Docker images
# built here and pushed to GitHub's registry (ghcr.io/<owner>/lovestory-{api,tools,web}:<commit>); then
# the release on the Lightsail server (deploy/release.sh, over SSH with a key that can only run that
# script), which pulls those images instead of building them. Building on the 1 GB server took about
# 5 minutes, during which the site answered in seconds instead of ~0.1 s.
#
# Run by hand (Actions > Deploy > Run workflow) on another branch, it only checks and pushes the images:
# releasing is for main alone.
#
# The packages must be public (the server pulls them without logging in): after the very first push, set
# each of the three to Public in the owner's Packages settings.
#
# Not used while the account may not create CloudFront distributions: S3 + CloudFront for the site
# (infra/app.yml, infra/deploy-client.sh).
#
# Secrets, in the `production` environment of the repository (Settings > Environments):
#   DEPLOY_HOST         address of the server (the static IP)
#   DEPLOY_SSH_KEY      private key whose public half is the forced-command entry on the server
#   DEPLOY_KNOWN_HOSTS  the server's host key line(s), so the connection is checked, not trusted blindly
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order; a newer push waits instead of cancelling a release half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # prisma.config.ts wants a DATABASE_URL even to generate the client; the tests use their own file.
      - run: npm --workspace server run prisma:generate
        env:
          DATABASE_URL: file:/tmp/ci-generate.db
      - run: npm run typecheck
      # No lint step yet: ESLint is not set up in the repo (no package, no config), so `npm run lint` fails.
      - run: npm test
      - run: npm run build:client

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: server/Dockerfile
            target: runtime
          - name: tools
            dockerfile: server/Dockerfile
            target: tools
          - name: web
            dockerfile: client/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      # Registry names must be lower case; the owner's login may not be.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lovestory-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          # The Lightsail instance is x86-64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Links the package to this repository (and its visibility settings) on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [check, images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://lovestory.vin
    steps:
      - name: Release on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server runs deploy/release.sh whatever is asked; the argument is the commit to release.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "ubuntu@$DEPLOY_HOST" "$GITHUB_SHA"
