AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  LoveStory - site and photos on S3 + CloudFront, and the IAM user the API stores photos with
  (see docs/deployment-decision.md)

# Deploy in eu-central-1, after certificate.yml. The server is a separate stack (server.yml), so a problem
# here never touches the instance that holds the database. See infra/README.md.
# Not in this template, on purpose: DNS records unless HostedZoneId is given, and IAM access keys (a key
# created by a stack would be readable in the stack).

Parameters:
  DomainName:
    Type: String
    Description: Apex domain of the site, for example example.com
    AllowedPattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
  CertificateArn:
    Type: String
    Description: ARN of the certificate from certificate.yml (it must be in us-east-1)
    AllowedPattern: ^arn:aws[a-z-]*:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone of the domain. When set, the records for the site, www and cdn are created
      in it. Empty means the DNS is elsewhere and you create them by hand (see the DnsRecordsToCreate output).

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # ---------------------------------------------------------------- buckets (all private)
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub ${SiteBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub ${MediaBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------- CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3
        Description: CloudFront signs its requests to the private buckets
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The single-page app. Missing paths come back from S3 as 403/404 and are answered with index.html, so
  # client-side routes work. This is safe only because the API is NOT behind this distribution.
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} site
        Aliases:
          - !Ref DomainName
          - !Sub www.${DomainName}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed policies: CachingOptimized, SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # The photos (S3_PUBLIC_URL=https://cdn.<domain>). No error rewriting: a missing photo stays an error.
  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} photos
        Aliases:
          - !Sub cdn.${DomainName}
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: media-bucket
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: media-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # ---------------------------------------------------------------- IAM user for the server
  # Create its access key by hand (infra/README.md); the key is not part of the stack.
  MediaUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: media-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # GetObject is for `npm run media:thumbnails`, which reads the originals back.
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${MediaBucket.Arn}/*

  # ---------------------------------------------------------------- DNS (only with a Route 53 zone)
  # Z2FDTNDATAQYW2 is the fixed hosted zone ID of every CloudFront distribution (alias targets need it).
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub www.${DomainName}
          Type: A
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub www.${DomainName}
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub cdn.${DomainName}
          Type: A
          AliasTarget:
            DNSName: !GetAtt MediaDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Sub cdn.${DomainName}
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt MediaDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  SiteBucketName:
    Description: Upload the built client here (client/dist)
    Value: !Ref SiteBucket
  SiteDistributionId:
    Description: Invalidate /index.html here after each client deploy
    Value: !Ref SiteDistribution
  SiteDistributionDomain:
    Description: Point the apex domain and www at this
    Value: !GetAtt SiteDistribution.DomainName
  MediaBucketName:
    Description: S3_BUCKET for the API
    Value: !Ref MediaBucket
  MediaDistributionDomain:
    Description: Point cdn.<domain> at this (CNAME); S3_PUBLIC_URL=https://cdn.<domain>
    Value: !GetAtt MediaDistribution.DomainName
  MediaUserName:
    Description: Create its access key for S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in deploy/.env
    Value: !Ref MediaUser
  DnsRecordsToCreate:
    Description: What to create at your DNS provider (already created by this stack when HostedZoneId is set)
    Value: !Sub "${DomainName} and www.${DomainName} -> ${SiteDistribution.DomainName} (ALIAS/CNAME); cdn.${DomainName} -> ${MediaDistribution.DomainName} (CNAME)"
