AWSTemplateFormatVersion: "2010-09-09"
Description: LoveStory - TLS certificate for CloudFront (CloudFront only accepts ACM certificates from us-east-1)

# Deploy this first, in us-east-1, then pass its CertificateArn output to app.yml. See infra/README.md.
# The certificate covers the site (apex and www) and the photo CDN. api.<domain> is not here: Caddy on the
# Lightsail instance gets its own Let's Encrypt certificate.

Parameters:
  DomainName:
    Type: String
    Description: Apex domain of the site, for example example.com
    AllowedPattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone of the domain. When set, the validation records are created in it automatically.
      Empty means the DNS is elsewhere and you add the validation records by hand.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]

Rules:
  MustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: This stack must be created in us-east-1, the only region CloudFront reads certificates from.

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub www.${DomainName}
        - !Sub cdn.${DomainName}
      # DNS validation: the stack waits until the validation CNAME records exist. With HostedZoneId they are
      # created in Route 53 for you; without it, add them at your DNS provider while the stack is being
      # created (the events and the ACM console show them).
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Sub www.${DomainName}
            HostedZoneId: !Ref HostedZoneId
          - DomainName: !Sub cdn.${DomainName}
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

Outputs:
  CertificateArn:
    Description: Pass this to app.yml as CertificateArn
    Value: !Ref Certificate
