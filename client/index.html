<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#3E5641" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Corinthia: the logo and footer headings. The hero's optional fonts are loaded only when chosen
         (src/features/public/home/textStyle.ts). -->
    <link href="https://fonts.googleapis.com/css2?family=Corinthia:wght@700&display=swap" rel="stylesheet">
    <script>
      // The home page's splash photo is its largest element, and its address comes from /api/gallery.
      // Ask for it now instead of after the app's JS has loaded, and preload the copy this screen will
      // use (the 9:16 crop on phones held upright: HERO_PORTRAIT_MEDIA in src/shared/hero.ts). The app
      // takes this response instead of asking again (takeEarlyGallery in src/shared/api/queries.ts).
      if (location.pathname === '/') {
        window.__earlyGallery = fetch('/api/gallery', { credentials: 'same-origin' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
        window.__earlyGallery.then(function (g) {
          var hero = g && g.hero;
          if (!hero) return;
          var portrait = '(max-aspect-ratio: 9/16)';
          var add = function (href, media) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = href;
            link.setAttribute('fetchpriority', 'high');
            if (media) link.media = media;
            document.head.appendChild(link);
          };
          if (hero.portraitUrl) {
            add(hero.portraitUrl, portrait);
            add(hero.url, 'not all and ' + portrait);
          } else {
            add(hero.url);
          }
        });
      }
    </script>
    <meta
      name="description"
      content="A private 60 m² riverside guest house — fishing, fire-cooking, and a heated outdoor tub. Your boutique countryside escape."
    />
    <meta property="og:title" content="LoveStory Riverside Retreat" />
    <meta property="og:type" content="website" />
    <title>LoveStory Riverside Retreat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
