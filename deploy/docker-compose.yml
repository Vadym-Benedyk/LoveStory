# Production stack for one Lightsail instance: Caddy (HTTPS) -> API -> SQLite in a folder on the host.
# Configured through deploy/.env (copy .env.example). The runbook is in deploy/README.md.
name: lovestory

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # A prebuilt image (API_IMAGE=registry/name:tag, then `docker compose pull`) or built right here.
    image: ${API_IMAGE:-lovestory-api:local}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: file:/data/lovestory.db
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: keep this volume, or Let's Encrypt rate limits bite after a few rebuilds.
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # One-off jobs against the production data (schema push, seed, photo copies, password reset).
  # Not started by `up`; run with `docker compose run --rm tools npm run <script>`.
  tools:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: tools
    image: lovestory-tools:local
    env_file: .env
    environment:
      DATABASE_URL: file:/data/lovestory.db
    volumes:
      - ${DATA_DIR:-./data}:/data

volumes:
  caddy_data:
  caddy_config:
